# Hot reload for the storefront: `air` (install once: go install github.com/air-verse/air@latest)
root = "."
tmp_dir = ".air"

[build]
  pre_cmd = ["go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate -path internal/web/views"]
  cmd = "go build -o bin/georges ./cmd/georges"
  entrypoint = ["bin/georges", "serve"]
  include_ext = ["go", "templ", "css", "js", "sql"]
  exclude_dir = [".air", "bin", "data", "docs", "testdata", ".chrome-profile", "deploy"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  delay = 400
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
