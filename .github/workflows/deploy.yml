name: Deploy

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate -path internal/web/views
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/h3bzzz/georges-showroom:${{ github.sha }}
            ghcr.io/h3bzzz/georges-showroom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # the VPS follows main; v2 pushes only test and build the image
    if: github.ref == 'refs/heads/main' && vars.HOSTINGER_VM_ID != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: georges-showroom
          docker-compose-path: docker-compose.yml
          environment-variables: |
            IMAGE_TAG=${{ github.sha }}
            DOMAIN=${{ vars.DOMAIN }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GATE_HASH=${{ secrets.GATE_HASH }}
            DATA_PATH=/srv/georges/data
