# Production stack for the Hostinger VPS. Caddy terminates TLS and serves the static image
# ladder and assets straight from disk; the Go app only renders HTML.
#
#   DOMAIN             public hostname (Caddy fetches the certificate)
#   POSTGRES_PASSWORD  database password
#   IMAGE_TAG          image tag to run (the workflow passes the commit SHA)
#   DATA_PATH          host folder holding DATA_DIR (assets/, catalogs/, logos/, covers/, …)
#   GATE_HASH          bcrypt hash of the preview password; leave empty to open the site
#   ANTHROPIC_API_KEY  enables the showroom assistant (/chat); CHAT_MODEL picks the model
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: georges
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-georges}
      POSTGRES_DB: georges2
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB", "-c", "work_mem=16MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georges -d georges2"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: ghcr.io/h3bzzz/georges-showroom:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://georges:${POSTGRES_PASSWORD:-georges}@db:5432/georges2?sslmode=disable
      DATA_DIR: /data
      ENV: prod
      PUBLIC_URL: https://${DOMAIN:-localhost}
      # the showroom assistant (empty hides it); the picture matcher needs DATA_DIR/tools synced
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5-5}
    volumes:
      - ${DATA_PATH:-/srv/georges/data}:/data:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      GATE_HASH: ${GATE_HASH:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${DATA_PATH:-/srv/georges/data}/assets:/srv/assets:ro

configs:
  caddyfile:
    content: |
      # the preview gate: every visitor logs in as "georges" with the password whose bcrypt
      # hash is GATE_HASH (caddy hash-password); remove the two "import gate" lines to open the site
      (gate) {
          basic_auth {
              georges {$$GATE_HASH}
          }
      }
      (site) {
          import gate
          # compress pages and text assets; never the assistant's event stream (/chat), which
          # must reach the browser token by token
          encode zstd gzip {
              match {
                  header Content-Type text/html*
                  header Content-Type text/css*
                  header Content-Type application/javascript*
                  header Content-Type application/json*
                  header Content-Type image/svg+xml*
                  header Content-Type application/xml*
              }
          }
          # product pictures: pre-built, content-addressed, immutable, straight from disk
          handle_path /a/* {
              root * /srv/assets
              rewrite * /{http.regexp.a.1}/{http.regexp.a.2}/{http.regexp.a.3}/{http.regexp.a.4}
              header Cache-Control "public, max-age=31536000, immutable"
              file_server
          }
          reverse_proxy app:8080
      }
      :80 {
          @a path_regexp a ^/a/(([0-9a-f]{2})([0-9a-f]{2})[0-9a-f]{12})/([0-9]+\.webp)$
          import site
      }
      {$$DOMAIN} {
          @a path_regexp a ^/a/(([0-9a-f]{2})([0-9a-f]{2})[0-9a-f]{12})/([0-9]+\.webp)$
          import site
      }
      www.{$$DOMAIN} {
          redir https://{$$DOMAIN}{uri} permanent
      }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
